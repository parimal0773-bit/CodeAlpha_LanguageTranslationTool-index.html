<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Translation Tool - CodeAlpha</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
            font-size: 1.1em;
        }

        .translation-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            .translation-box {
                grid-template-columns: 1fr;
            }
        }

        .input-section {
            display: flex;
            flex-direction: column;
        }

        .input-section label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 1.1em;
        }

        select, textarea {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
            transition: border-color 0.3s;
            margin-bottom: 12px;
        }

        select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 200px;
            font-size: 0.95em;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: center;
        }

        button {
            flex: 1;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .translate-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .translate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .clear-btn {
            background: #f0f0f0;
            color: #333;
        }

        .clear-btn:hover {
            background: #e0e0e0;
        }

        .copy-btn {
            background: #4CAF50;
            color: white;
            padding: 8px 16px;
            font-size: 0.9em;
            margin-top: 10px;
        }

        .copy-btn:hover {
            background: #45a049;
        }

        .error {
            color: #d32f2f;
            font-size: 0.95em;
            margin-top: 10px;
        }

        .success {
            color: #388e3c;
            font-size: 0.95em;
            margin-top: 10px;
        }

        .loading {
            text-align: center;
            color: #667eea;
            font-weight: 600;
            margin-top: 10px;
        }

        .char-count {
            font-size: 0.85em;
            color: #999;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌍 Language Translator</h1>
        <p class="subtitle">Translate any language to your targeted language</p>

        <div class="translation-box">
            <!-- Source Language Section -->
            <div class="input-section">
                <label for="sourceLanguage">Source Language:</label>
                <select id="sourceLanguage">
                    <option value="en">English</option>
                    <option value="es">Spanish</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="it">Italian</option>
                    <option value="pt">Portuguese</option>
                    <option value="ru">Russian</option>
                    <option value="ja">Japanese</option>
                    <option value="ko">Korean</option>
                    <option value="zh">Chinese (Simplified)</option>
                    <option value="ar">Arabic</option>
                    <option value="hi">Hindi</option>
                    <option value="auto">Auto Detect</option>
                </select>
                <label for="sourceText">Text to Translate:</label>
                <textarea id="sourceText" placeholder="Enter text to translate..."></textarea>
                <div class="char-count">Characters: <span id="charCount">0</span></div>
            </div>

            <!-- Target Language Section -->
            <div class="input-section">
                <label for="targetLanguage">Target Language:</label>
                <select id="targetLanguage">
                    <option value="en">English</option>
                    <option value="es">Spanish</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="it">Italian</option>
                    <option value="pt">Portuguese</option>
                    <option value="ru">Russian</option>
                    <option value="ja">Japanese</option>
                    <option value="ko">Korean</option>
                    <option value="zh">Chinese (Simplified)</option>
                    <option value="ar">Arabic</option>
                    <option value="hi">Hindi</option>
                </select>
                <label for="translatedText">Translated Text:</label>
                <textarea id="translatedText" placeholder="Translation will appear here..." readonly></textarea>
                <button class="copy-btn" onclick="copyToClipboard()">📋 Copy Translation</button>
                <div id="message"></div>
            </div>
        </div>

        <div class="button-group">
            <button class="translate-btn" onclick="translateText()">Translate</button>
            <button class="clear-btn" onclick="clearFields()">Clear</button>
        </div>
    </div>

    <script>
        // Update character count
        document.getElementById('sourceText').addEventListener('input', function() {
            document.getElementById('charCount').textContent = this.value.length;
        });

        async function translateText() {
            const sourceText = document.getElementById('sourceText').value;
            const sourceLanguage = document.getElementById('sourceLanguage').value;
            const targetLanguage = document.getElementById('targetLanguage').value;
            const messageDiv = document.getElementById('message');

            if (!sourceText.trim()) {
                messageDiv.innerHTML = '<div class="error">Please enter text to translate!</div>';
                return;
            }

            if (sourceLanguage === targetLanguage) {
                messageDiv.innerHTML = '<div class="error">Source and target languages must be different!</div>';
                return;
            }

            messageDiv.innerHTML = '<div class="loading">Translating...</div>';

            try {
                // Using Google Translate API (free tier via RapidAPI or similar service)
                // For a production app, you'd use a proper translation API
                
                // Simple demonstration - replace with actual API call
                const translatedText = await performTranslation(sourceText, sourceLanguage, targetLanguage);
                
                document.getElementById('translatedText').value = translatedText;
                messageDiv.innerHTML = '<div class="success">✓ Translation successful!</div>';
            } catch (error) {
                messageDiv.innerHTML = '<div class="error">Error: ' + error.message + '</div>';
                console.error('Translation error:', error);
            }
        }

        async function performTranslation(text, sourceLang, targetLang) {
            // Placeholder function - integrate with real translation API
            // Example: Google Translate API, Microsoft Translator, or similar
            
            return new Promise((resolve) => {
                // Simulated translation for demo
                setTimeout(() => {
                    resolve(`[Translated to ${targetLang}] ${text}`);
                }, 1000);
            });
        }

        function clearFields() {
            document.getElementById('sourceText').value = '';
            document.getElementById('translatedText').value = '';
            document.getElementById('message').innerHTML = '';
            document.getElementById('charCount').textContent = '0';
        }

        function copyToClipboard() {
            const translatedText = document.getElementById('translatedText');
            if (!translatedText.value) {
                alert('Nothing to copy!');
                return;
            }
            
            translatedText.select();
            document.execCommand('copy');
            
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = '<div class="success">✓ Copied to clipboard!</div>';
            setTimeout(() => {
                messageDiv.innerHTML = '';
            }, 2000);
        }
    </script>
</body>
</html>
