<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinguaAI — Language Translation Tool</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #0d0d0d;
    --paper: #f5f2eb;
    --cream: #ede9e0;
    --accent: #c8440a;
    --accent-light: #f0cbb8;
    --muted: #8a8070;
    --border: #d4cfc4;
    --white: #fdfcfa;
    --success: #2d6a4f;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  header {
    padding: 1.5rem 2.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    background: var(--white);
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 1.4rem;
    letter-spacing: -0.03em;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  .logo span {
    color: var(--accent);
  }

  .badge {
    font-size: 0.7rem;
    font-weight: 500;
    background: var(--accent-light);
    color: var(--accent);
    padding: 3px 10px;
    border-radius: 20px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  /* Main layout */
  main {
    flex: 1;
    max-width: 1100px;
    margin: 0 auto;
    width: 100%;
    padding: 3rem 2rem;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  .tagline {
    font-family: 'Syne', sans-serif;
    font-size: 2.2rem;
    font-weight: 700;
    letter-spacing: -0.04em;
    line-height: 1.1;
    color: var(--ink);
  }

  .tagline em {
    font-style: italic;
    color: var(--accent);
    font-weight: 400;
  }

  /* Language bar */
  .lang-bar {
    display: flex;
    align-items: center;
    gap: 1rem;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 0.9rem 1.2rem;
  }

  .lang-select-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .lang-select-wrap label {
    font-size: 0.7rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
  }

  select {
    border: none;
    background: transparent;
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    font-weight: 500;
    color: var(--ink);
    cursor: pointer;
    outline: none;
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
  }

  .swap-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--cream);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  .swap-btn:hover {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
    transform: rotate(180deg);
  }

  /* Translation panels */
  .panels {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    min-height: 280px;
  }

  .panel {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.4rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    position: relative;
  }

  .panel-label {
    font-size: 0.7rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
  }

  textarea {
    flex: 1;
    border: none;
    background: transparent;
    font-family: 'DM Sans', sans-serif;
    font-size: 1.05rem;
    font-weight: 300;
    color: var(--ink);
    resize: none;
    outline: none;
    line-height: 1.7;
    min-height: 180px;
  }

  textarea::placeholder {
    color: var(--border);
  }

  .output-text {
    flex: 1;
    font-size: 1.05rem;
    font-weight: 300;
    color: var(--ink);
    line-height: 1.7;
    min-height: 180px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .output-placeholder {
    color: var(--border);
  }

  /* Panel footer */
  .panel-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid var(--cream);
    padding-top: 0.8rem;
    gap: 0.5rem;
  }

  .char-count {
    font-size: 0.75rem;
    color: var(--muted);
  }

  .icon-btn {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.9rem;
    color: var(--muted);
    transition: all 0.15s;
    position: relative;
  }

  .icon-btn:hover {
    background: var(--cream);
    color: var(--ink);
  }

  .icon-btn.copied {
    background: var(--accent-light);
    color: var(--accent);
    border-color: var(--accent-light);
  }

  .btn-row {
    display: flex;
    gap: 0.5rem;
    align-items: center;
  }

  /* Translate button */
  .translate-btn {
    width: 100%;
    padding: 1rem;
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 12px;
    font-family: 'Syne', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .translate-btn:hover {
    background: var(--accent);
  }

  .translate-btn:active {
    transform: scale(0.99);
  }

  .translate-btn:disabled {
    background: var(--border);
    cursor: not-allowed;
  }

  /* Loading spinner */
  .spinner {
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    display: none;
  }

  .loading .spinner { display: block; }
  .loading .btn-label { display: none; }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* Status bar */
  .status {
    font-size: 0.8rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.6rem 1rem;
    border-radius: 8px;
    transition: all 0.3s;
  }

  .status.error {
    background: #fde8e8;
    color: #8b1a1a;
  }

  .status.success {
    background: #e6f4ed;
    color: var(--success);
  }

  .status.hidden { display: none; }

  /* History section */
  .history-section {
    margin-top: 0.5rem;
  }

  .history-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.8rem;
  }

  .section-title {
    font-family: 'Syne', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .clear-btn {
    font-size: 0.75rem;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
    font-family: 'DM Sans', sans-serif;
  }

  .clear-btn:hover { color: var(--accent); }

  .history-list {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .history-item {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.8rem 1rem;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 0.8rem;
    align-items: center;
    font-size: 0.88rem;
  }

  .history-src { color: var(--muted); }
  .history-arrow { color: var(--border); font-size: 1rem; }
  .history-tgt { color: var(--ink); font-weight: 500; }
  .history-langs {
    font-size: 0.7rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-top: 2px;
  }

  /* TTS */
  .speaking {
    color: var(--accent) !important;
    border-color: var(--accent-light) !important;
  }

  @media (max-width: 700px) {
    .panels { grid-template-columns: 1fr; }
    .tagline { font-size: 1.5rem; }
    header { padding: 1rem 1.2rem; }
    main { padding: 1.5rem 1rem; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">Lingua<span>AI</span></div>
  <span class="badge">CodeAlpha Task 1</span>
</header>

<main>
  <h1 class="tagline">Translate anything,<br><em>instantly.</em></h1>

  <!-- Language selector bar -->
  <div class="lang-bar">
    <div class="lang-select-wrap">
      <label>From</label>
      <select id="srcLang">
        <option value="auto">Detect Language</option>
        <option value="en">English</option>
        <option value="hi">Hindi</option>
        <option value="es">Spanish</option>
        <option value="fr">French</option>
        <option value="de">German</option>
        <option value="zh">Chinese (Simplified)</option>
        <option value="ja">Japanese</option>
        <option value="ko">Korean</option>
        <option value="ar">Arabic</option>
        <option value="pt">Portuguese</option>
        <option value="ru">Russian</option>
        <option value="it">Italian</option>
        <option value="nl">Dutch</option>
        <option value="tr">Turkish</option>
        <option value="pl">Polish</option>
        <option value="sv">Swedish</option>
        <option value="bn">Bengali</option>
        <option value="ta">Tamil</option>
        <option value="te">Telugu</option>
      </select>
    </div>

    <button class="swap-btn" id="swapBtn" title="Swap languages">⇄</button>

    <div class="lang-select-wrap">
      <label>To</label>
      <select id="tgtLang">
        <option value="hi">Hindi</option>
        <option value="en">English</option>
        <option value="es">Spanish</option>
        <option value="fr">French</option>
        <option value="de">German</option>
        <option value="zh">Chinese (Simplified)</option>
        <option value="ja">Japanese</option>
        <option value="ko">Korean</option>
        <option value="ar">Arabic</option>
        <option value="pt">Portuguese</option>
        <option value="ru">Russian</option>
        <option value="it">Italian</option>
        <option value="nl">Dutch</option>
        <option value="tr">Turkish</option>
        <option value="pl">Polish</option>
        <option value="sv">Swedish</option>
        <option value="bn">Bengali</option>
        <option value="ta">Tamil</option>
        <option value="te">Telugu</option>
      </select>
    </div>
  </div>

  <!-- Text panels -->
  <div class="panels">
    <div class="panel">
      <div class="panel-label">Source text</div>
      <textarea id="srcText" placeholder="Enter text to translate…" maxlength="2000"></textarea>
      <div class="panel-footer">
        <span class="char-count" id="charCount">0 / 2000</span>
        <div class="btn-row">
          <button class="icon-btn" id="clearBtn" title="Clear">✕</button>
          <button class="icon-btn" id="ttsSrc" title="Listen (source)">🔊</button>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-label">Translation</div>
      <div class="output-text" id="outputText">
        <span class="output-placeholder">Translation appears here…</span>
      </div>
      <div class="panel-footer">
        <span class="char-count" id="detectedLang"></span>
        <div class="btn-row">
          <button class="icon-btn" id="copyBtn" title="Copy translation">📋</button>
          <button class="icon-btn" id="ttsTgt" title="Listen (translation)">🔊</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Status -->
  <div class="status hidden" id="status"></div>

  <!-- Translate button -->
  <button class="translate-btn" id="translateBtn">
    <div class="spinner"></div>
    <span class="btn-label">Translate →</span>
  </button>

  <!-- History -->
  <div class="history-section" id="historySection" style="display:none">
    <div class="history-header">
      <span class="section-title">Recent translations</span>
      <button class="clear-btn" id="clearHistory">Clear all</button>
    </div>
    <div class="history-list" id="historyList"></div>
  </div>
</main>

<script>
  const srcLang = document.getElementById('srcLang');
  const tgtLang = document.getElementById('tgtLang');
  const srcText = document.getElementById('srcText');
  const outputText = document.getElementById('outputText');
  const translateBtn = document.getElementById('translateBtn');
  const charCount = document.getElementById('charCount');
  const detectedLang = document.getElementById('detectedLang');
  const status = document.getElementById('status');
  const copyBtn = document.getElementById('copyBtn');
  const clearBtn = document.getElementById('clearBtn');
  const swapBtn = document.getElementById('swapBtn');
  const ttsSrc = document.getElementById('ttsSrc');
  const ttsTgt = document.getElementById('ttsTgt');
  const historySection = document.getElementById('historySection');
  const historyList = document.getElementById('historyList');

  let lastTranslation = '';
  let history = JSON.parse(localStorage.getItem('lingua_history') || '[]');

  const LANG_NAMES = {
    auto:'Auto', en:'English', hi:'Hindi', es:'Spanish', fr:'French',
    de:'German', zh:'Chinese', ja:'Japanese', ko:'Korean', ar:'Arabic',
    pt:'Portuguese', ru:'Russian', it:'Italian', nl:'Dutch', tr:'Turkish',
    pl:'Polish', sv:'Swedish', bn:'Bengali', ta:'Tamil', te:'Telugu'
  };

  // Char counter
  srcText.addEventListener('input', () => {
    charCount.textContent = `${srcText.value.length} / 2000`;
  });

  // Clear
  clearBtn.addEventListener('click', () => {
    srcText.value = '';
    charCount.textContent = '0 / 2000';
    outputText.innerHTML = '<span class="output-placeholder">Translation appears here…</span>';
    detectedLang.textContent = '';
    lastTranslation = '';
    showStatus('', '');
  });

  // Swap languages
  swapBtn.addEventListener('click', () => {
    if (srcLang.value === 'auto') return;
    const tmp = srcLang.value;
    srcLang.value = tgtLang.value;
    tgtLang.value = tmp;
    if (lastTranslation && srcText.value) {
      const tmp2 = srcText.value;
      srcText.value = lastTranslation;
      outputText.textContent = tmp2;
      lastTranslation = tmp2;
      charCount.textContent = `${srcText.value.length} / 2000`;
    }
  });

  // Translate
  translateBtn.addEventListener('click', doTranslate);
  srcText.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) doTranslate();
  });

  async function doTranslate() {
    const text = srcText.value.trim();
    if (!text) { showStatus('Please enter some text to translate.', 'error'); return; }

    setLoading(true);
    showStatus('', '');

    try {
      const src = srcLang.value === 'auto' ? 'auto' : srcLang.value;
      const tgt = tgtLang.value;

      // MyMemory free API — no key required, 5000 chars/day free
      const langPair = src === 'auto' ? `|${tgt}` : `${src}|${tgt}`;
      const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${encodeURIComponent(langPair)}`;

      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();

      if (data.responseStatus !== 200) throw new Error(data.responseMessage || 'Translation failed');

      const translated = data.responseData.translatedText;
      lastTranslation = translated;
      outputText.textContent = translated;

      // Detected language info
      if (src === 'auto' && data.responseData.detectedLanguage) {
        detectedLang.textContent = `Detected: ${data.responseData.detectedLanguage}`;
      } else {
        detectedLang.textContent = '';
      }

      showStatus('Translation complete', 'success');
      addToHistory(text, translated, src === 'auto' ? 'auto' : LANG_NAMES[src], LANG_NAMES[tgt]);

    } catch (err) {
      showStatus('Translation failed. Check your connection and try again.', 'error');
      console.error(err);
    } finally {
      setLoading(false);
    }
  }

  function setLoading(val) {
    translateBtn.disabled = val;
    translateBtn.classList.toggle('loading', val);
  }

  function showStatus(msg, type) {
    if (!msg) { status.className = 'status hidden'; return; }
    status.textContent = msg;
    status.className = `status ${type}`;
  }

  // Copy
  copyBtn.addEventListener('click', () => {
    if (!lastTranslation) return;
    navigator.clipboard.writeText(lastTranslation).then(() => {
      copyBtn.classList.add('copied');
      copyBtn.textContent = '✓';
      setTimeout(() => { copyBtn.classList.remove('copied'); copyBtn.textContent = '📋'; }, 1500);
    });
  });

  // TTS
  function speak(text, lang) {
    if (!text) return;
    window.speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(text);
    utt.lang = lang;
    window.speechSynthesis.speak(utt);
  }

  ttsSrc.addEventListener('click', () => {
    const lang = srcLang.value === 'auto' ? 'en' : srcLang.value;
    speak(srcText.value, lang);
  });

  ttsTgt.addEventListener('click', () => {
    speak(lastTranslation, tgtLang.value);
  });

  // History
  function addToHistory(src, tgt, srcName, tgtName) {
    history.unshift({ src, tgt, srcName, tgtName, ts: Date.now() });
    history = history.slice(0, 5);
    localStorage.setItem('lingua_history', JSON.stringify(history));
    renderHistory();
  }

  function renderHistory() {
    if (!history.length) { historySection.style.display = 'none'; return; }
    historySection.style.display = 'block';
    historyList.innerHTML = history.map(h => `
      <div class="history-item">
        <div>
          <div class="history-src">${esc(h.src.slice(0, 80))}${h.src.length > 80 ? '…' : ''}</div>
          <div class="history-langs">${h.srcName}</div>
        </div>
        <div class="history-arrow">→</div>
        <div>
          <div class="history-tgt">${esc(h.tgt.slice(0, 80))}${h.tgt.length > 80 ? '…' : ''}</div>
          <div class="history-langs">${h.tgtName}</div>
        </div>
      </div>
    `).join('');
  }

  document.getElementById('clearHistory').addEventListener('click', () => {
    history = [];
    localStorage.removeItem('lingua_history');
    renderHistory();
  });

  function esc(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  renderHistory();
</script>
</body>
</html>
